#!/usr/sbin/nft -f
# The portal guest: SSH from the Proxmox host (the jump host) only, port 3000
# (Anubis, in front of the portal) from nginx-proxy only. The portal itself
# (127.0.0.1:3001) and Anubis's metrics (127.0.0.1:9090) are loopback-only.
# NGINX_PROXY_IP is filled in by lxc-bootstrap.sh.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    ip saddr 10.0.0.1 tcp dport 22 accept
    ip saddr NGINX_PROXY_IP tcp dport 3000 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
