# /etc/anubis/oc-portal.botPolicies.yaml on the NOC's guest (LXC 118 oc-noc,
# NOC design §N1.5; `install-anubis.sh noc` installs it under that name):
# which requests Anubis lets through to the NOC's site, and which it
# challenges first. It is oc-portal.botPolicies.yaml without the public
# pages (the NOC's site has none: its front page is the NOC) and without the
# ALTCHA worker (it has no sign-up). Everything else is the portal's, rule
# for rule, for the same reasons.
# Syntax: docs/docs/admin/policies.mdx and configuration/expressions.mdx in
# the Anubis repository. Rules are tried in order; the first match decides.
#
# Two things about Anubis shape this file:
# - A pass is bound to the rule that issued it (the pass cookie carries a hash
#   of the rule's name and matchers). A pass from one CHALLENGE rule is no
#   pass under another: the other rule clears it and challenges again. So
#   everything behind the proof of work is ONE rule (the last), and the only
#   other challenge is the email links' no-JavaScript one.
# - Next.js lets a server action be POSTed to any page (it forwards the call
#   to the page that has it), so a POST is never let through as "public":
#   the ALLOW rules below take only GET and HEAD.
# - Anubis matches the path as sent (percent-decoded, never cleaned), while
#   nginx-proxy passes it on raw and Next resolves dot segments: without a
#   guard, /_next/static/../../sign-in would be "static" to Anubis and the
#   sign-in page to Next. So no ALLOW rule matches a path with a "." or ".."
#   segment (decoded, so %2e%2e and .%2E count too): those fall through to
#   the challenge. Every ALLOW rule carries the line, the exact-path ones too,
#   so none can lose it by being widened later.
bots:
  # 1. The deploy's and any monitor's health check. First, so that no rule
  #    added later can ever challenge it.
  - name: health-check
    action: ALLOW
    expression:
      all:
        - method == "GET" || method == "HEAD"
        - path == "/healthz"
        - '!path.matches("/\\.\\.?(/|$)")'

  # 2. Next's build output (content-hashed JS and CSS), which every page
  #    needs, the public ones included.
  - name: next-static
    action: ALLOW
    expression:
      all:
        - method == "GET" || method == "HEAD"
        - path.startsWith("/_next/static/")
        - '!path.matches("/\\.\\.?(/|$)")'

  # 3. Files a browser or a crawler fetches on its own, without cookies: the
  #    favicon and app icons, the web manifest, /.well-known/. (robots.txt
  #    never gets here: Anubis answers it itself, SERVE_ROBOTS_TXT=true.)
  - name: site-files
    action: ALLOW
    expression:
      all:
        - method == "GET" || method == "HEAD"
        - path.matches("^/(favicon\\.ico|(apple-)?icon[0-9a-z._-]*|manifest\\.webmanifest)$") || path.startsWith("/.well-known/")
        - '!path.matches("/\\.\\.?(/|$)")'

  # (No public pages: every page of the NOC's site is behind the proof of work.)

  # 4. The links the site emails (/auth/email/<token>): the page and its
  #    Confirm button's POST. The no-JavaScript challenge, so a link opened
  #    in a mail client's browser or with scripts off still works: the page
  #    refreshes itself after 2 s. (The page only shows a button; the token
  #    is used when a person presses it.)
  - name: email-links
    path_regex: ^/auth/email/[^/]+$
    action: CHALLENGE
    challenge:
      algorithm: metarefresh
      difficulty: 1 # seconds to wait (the page refreshes after difficulty + 1)

  # 5. Everything else, every method: /, /sign-in, /account, /noc/...,
  #    /admin/..., their server-action POSTs, and any path not listed above
  #    (scanners' /wp-login.php and the like get the challenge, not a
  #    server-rendered 404). The
  #    JavaScript proof of work at Anubis's default difficulty: 4 leading hex
  #    zeros, about 65 000 SHA-256 hashes, a second or two on a phone.
  - name: noc
    path_regex: .*
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4

# Challenges in flight, on disk: the in-memory store is unbounded and the
# Anubis docs keep it for testing. (The pass cookies themselves are checked by
# signature, with the key in /etc/anubis/oc-portal.key.env, so they survive a
# restart either way.)
store:
  backend: bbolt
  parameters:
    path: /var/lib/anubis/oc-portal/anubis.bdb

# Warnings and errors only: at INFO Anubis logs every challenge with the
# client's address, and the site keeps personal data to what it needs
# (portal spec §10). For a look at what it is doing, set INFO or DEBUG here
# for a while and restart anubis@oc-portal.
logging:
  sink: stdio
  level: WARN
