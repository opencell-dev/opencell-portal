# /etc/systemd/system/anubis@oc-portal.service.d/opencell.conf on the portal
# guest: additions to the anubis@.service unit the Anubis .deb ships
# (/usr/lib/systemd/system/anubis@.service: DynamicUser, EnvironmentFile
# /etc/anubis/%i.env, StateDirectory anubis/%i, Restart=always).
[Unit]
Description=Anubis in front of the OpenCell web portal
After=network-online.target
Wants=network-online.target

[Service]
# The JWT signing key (ED25519_PRIVATE_KEY_HEX), made on the guest by
# install-anubis.sh, root 0600: systemd reads it before dropping to the
# dynamic user. A fixed key keeps passes valid across restarts, and the
# bbolt store needs one.
EnvironmentFile=/etc/anubis/oc-portal.key.env
RestartSec=2
# The package asks for LimitNOFILE=infinity, which an unprivileged container
# may not grant; this is plenty for one small site.
LimitNOFILE=65536
UMask=0077
# The same hardening oc-portal.service already runs with on this guest.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
