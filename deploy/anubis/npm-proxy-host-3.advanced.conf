# OpenCell: replaces NPM's default "location /" for this host (portal deploy/anubis/README.md, "Client addresses").
# Same as NPM's generated block and conf.d/include/proxy.conf, except that
# X-Forwarded-For is $remote_addr only: a client-sent X-Forwarded-For is dropped.
# (This nginx has no headers-more module, so more_clear_input_headers is not available.)
location / {
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_http_version 1.1;

  add_header       X-Served-By $host;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Scheme $x_forwarded_scheme;
  proxy_set_header X-Forwarded-Proto  $x_forwarded_proto;
  proxy_set_header X-Forwarded-For    $remote_addr;
  proxy_set_header X-Real-IP          $remote_addr;
  proxy_pass       $forward_scheme://$server:$port$request_uri;
}
