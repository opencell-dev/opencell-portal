# /etc/systemd/system/oc-portal-nanpa.service.d/route-delegate.conf on the
# portal guest (portal plan P5, OCSS spec §5.4). The route delegate's private
# key, handed to the weekly refresh alone as a credential: /etc/opencell stays
# root's and the service user reads only its $CREDENTIALS_DIRECTORY copy. The
# web process never gets it. portal.env names it
# (OC_ROUTE_DELEGATE_KEY=route-delegate.key). oc-portal-deploy places this file
# when the key file exists and removes it when it doesn't: a LoadCredential of a
# missing file fails the unit (243/CREDENTIALS), and a refresh must still import
# without the key (it logs "no delegate key").
#
# Runbook, once, on the first deploy with P5. oc-portal-deploy does not install
# units (lxc-bootstrap.sh does), so on the live guest, as root:
#
#   1. The refresh's unit, which now holds the core TLS credentials too, and the
#      admin wrapper, which passes them on for nanpa-refresh --dir:
#        install -m 0644 /opt/oc-portal/current/deploy/oc-portal-nanpa.service /etc/systemd/system/
#        install -m 0755 /opt/oc-portal/current/deploy/oc-portal-admin /usr/local/bin/
#        systemctl daemon-reload
#   2. In /etc/opencell/portal.env: OC_ROUTE_DELEGATE_KEY=route-delegate.key
#   3. The key, from the laptop (it never goes in git, the database or a backup):
#        scp -F ~/.ssh/cm/oc-portal.conf ~/.config/opencell/secrets/portal-route-delegate.key oc-portal:/etc/opencell/tls/route-delegate.key
#      then on the guest:
#        chown root:root /etc/opencell/tls/route-delegate.key
#        chmod 0400 /etc/opencell/tls/route-delegate.key
#   4. This drop-in: the next deploy places it, or now:
#        install -D -m 0644 /opt/oc-portal/current/deploy/oc-portal-route-delegate.conf /etc/systemd/system/oc-portal-nanpa.service.d/route-delegate.conf
#        systemctl daemon-reload
#   5. The first refresh (about 3 minutes):
#        systemctl start oc-portal-nanpa.service; journalctl -u oc-portal-nanpa -n 20
#      With the table up to date, expect no "route:" lines at all. "route:
#      offered NPAs ..." is a new NPA going out, and `oc-core admin status` then
#      shows the new block count on each core. "route: no delegate key": steps
#      2-4. "route: ... every core refused it": the key is not the delegate
#      the table names (compare `oc-route pub KEY` with OCSS spec §3.7's); nothing
#      is held, so the next run signs that seq again. "route: ... ahead of the
#      portal": the cores hold an addition this database doesn't, usually after
#      restoring portal.db from a backup; nothing new is signed, which is safe.
#      Recover by putting the missing additions' NPAs in a new root version
#      (below), or, if no core is behind, by deleting that root version's rows
#      from route_additions, so the next run goes on from the cores' seq.
#
# Renewing: a delegation lasts 365 days, and from 30 days before its end each
# refresh logs "route: the delegation ends ...". A renewal, or a new delegate
# key, is a new root version, made on the laptop where the root key lives and
# installed like the first (OCSS spec §3.7, §5.4): oc-route make ... --version
# N+1 --prev OLD.tbl --floor MAX --delegate PUBHEX, MAX being what route.status
# reports; every addition's NPA goes in the CSV with its index as --pin NPA=IDX;
# then copy route.tbl to /etc/opencell/route.tbl on every core and restart them.
# The portal ignores additions kept for the older root version from then on.
[Service]
LoadCredential=route-delegate.key:/etc/opencell/tls/route-delegate.key
