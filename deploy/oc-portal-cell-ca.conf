# /etc/systemd/system/oc-portal.service.d/cell-ca.conf on the portal guest
# (portal plan P3, portal spec §8.3). The online cell intermediate's certificate
# and key, handed to oc-portal as credentials: /etc/opencell stays root's (0700)
# and the service user reads only its $CREDENTIALS_DIRECTORY copies. portal.env
# names them (OC_CELL_CA_CERT=cell-ca.crt, OC_CELL_CA_KEY=cell-ca.key).
# oc-portal-deploy places this file when both files exist and removes it when
# they don't: a LoadCredential of a missing file fails the unit (243/CREDENTIALS).
#
# Runbook, once, on the first deploy with P3. oc-portal-deploy does not install
# units (lxc-bootstrap.sh does), and P3 adds none, only this drop-in. As root on
# the guest, unless it says the laptop:
#
#   1. In /etc/opencell/portal.env (see deploy/portal.env.example):
#        OC_CELL_CA_CERT=cell-ca.crt
#        OC_CELL_CA_KEY=cell-ca.key
#        OC_CORE_CORE1_CELLS=core1.opencell.k4ozi.com:47443
#        OC_CORE_CORE2_CELLS=core2.opencell.k4ozi.com:7443
#        OC_RELEASE_DIR=/var/lib/oc-portal/releases
#   2. Deploy the tag: oc-portal-deploy applies the migration, places this drop-in
#      once the files of step 3 exist, and creates releases/.
#   3. On the laptop, where the root key is:
#        deploy/oc-portal-cell-ca init oc-portal
#      The key is made on the guest (/etc/opencell/tls/cell-ca.key, root 0400) and
#      never leaves it; the laptop signs its CSR; the certificate goes to
#      /etc/opencell/tls/cell-ca.crt; this drop-in goes in; the portal restarts.
#      It prints the intermediate's SHA-256 and end date. /admin shows them too.
#   4. On both cores, in /etc/opencell/oc-core.conf, then restart oc-core:
#        cell_issuers = root,<that SHA-256>
#      (root stays listed: T's certificate is root-issued.) From the first renewal
#      on, cell_ca becomes the bundle root + current intermediate (plan P3, C2).
#   5. Anubis's policy, for /setup: bash /opt/oc-portal/current/deploy/anubis/install-anubis.sh
#   6. The cell software, on the laptop:
#        deploy/oc-portal-cell-release ~/Documents/opencell/pi v0.2.0 oc-portal
#
# Renewing, on the laptop, yearly (the portal mails admins from 30 days before):
#   deploy/oc-portal-cell-ca renew oc-portal
# It re-signs the same key and subject, so 2-year leaves keep a valid issuer, and
# changes nothing yet. It prints the lines for both cores: cell_issuers gains the new
# SHA-256 and keeps the old one (existing leaves were issued under the old
# certificate), and cell_ca becomes the bundle root + this certificate. Restart them, then:
#   deploy/oc-portal-cell-ca install oc-portal
[Service]
LoadCredential=cell-ca.crt:/etc/opencell/tls/cell-ca.crt
LoadCredential=cell-ca.key:/etc/opencell/tls/cell-ca.key
