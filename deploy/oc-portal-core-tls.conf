# /etc/systemd/system/oc-portal.service.d/core-tls.conf on the portal guest
# (portal plan P4). The core admin API's TLS files, handed to oc-portal as
# credentials: /etc/opencell stays root's (0700) and the service user reads
# only its $CREDENTIALS_DIRECTORY copies. portal.env names them
# (OC_CORE_CA=core-ca.crt, OC_CORE_CERT=core-client.crt, OC_CORE_KEY=core-client.key).
# The files: /etc/opencell/tls/ca.crt (the OpenCell root), portal.crt (role
# portal, from tools/ca/oc-ca in opencell-core) and portal.key (made on this
# guest, root 0400; it never leaves it).
[Service]
LoadCredential=core-ca.crt:/etc/opencell/tls/ca.crt
LoadCredential=core-client.crt:/etc/opencell/tls/portal.crt
LoadCredential=core-client.key:/etc/opencell/tls/portal.key
